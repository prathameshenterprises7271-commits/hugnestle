<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FCE7EC" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#F5E6CC" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#D87093" flood-opacity="0.18" />
    </filter>
    <filter id="softBlush" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background Canvas with soft borders -->
  <rect width="600" height="600" rx="36" fill="url(#cardBg)" />
  <rect x="12" y="12" width="576" height="576" rx="28" stroke="#F8D7DA" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Cute Ambient Background Hearts & Stars -->
  <g opacity="0.35">
    <path d="M80 90 Q80 80 90 80 A8 8 0 0 1 106 88 A8 8 0 0 1 122 80 Q132 80 132 90 Q132 110 106 130 Q80 110 80 90 Z" fill="#F4A6B7" />
    <path d="M490 140 Q490 132 498 132 A6 6 0 0 1 510 138 A6 6 0 0 1 522 132 Q530 132 530 140 Q530 156 510 172 Q490 156 490 140 Z" fill="#E57399" />
    <circle cx="510" cy="380" r="14" fill="#FCE4EC" />
    <circle cx="90" cy="460" r="20" fill="#FFF0F5" />
    <path d="M120 380 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#F4A6B7" opacity="0.6" />
    <path d="M470 460 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#E57399" opacity="0.6" />
  </g>

  <!-- Main Character Graphic -->
  <g transform="translate(150, 100)" filter="url(#dropShadow)">

    <ellipse cx="150" cy="320" rx="90" ry="18" fill="#3E2723" opacity="0.1" />
    
    <!-- Long Floppy Bunny Ears -->
    <ellipse cx="95" cy="50" rx="22" ry="75" transform="rotate(-18 95 50)" fill="url(#bodyGrad)" />
    <ellipse cx="95" cy="50" rx="12" ry="60" transform="rotate(-18 95 50)" fill="#FCE4EC" />

    <ellipse cx="205" cy="50" rx="22" ry="75" transform="rotate(18 205 50)" fill="url(#bodyGrad)" />
    <ellipse cx="205" cy="50" rx="12" ry="60" transform="rotate(18 205 50)" fill="#FCE4EC" />

    <!-- Body -->
    <ellipse cx="150" cy="235" rx="92" ry="85" fill="url(#bodyGrad)" />
    <ellipse cx="150" cy="245" rx="55" ry="50" fill="#FFFDF7" />

    <!-- Paws -->
    <ellipse cx="65" cy="225" rx="24" ry="42" transform="rotate(25 65 225)" fill="url(#bodyGrad)" />
    <ellipse cx="235" cy="225" rx="24" ry="42" transform="rotate(-25 235 225)" fill="url(#bodyGrad)" />
    <ellipse cx="100" cy="305" rx="32" ry="20" fill="url(#bodyGrad)" />
    <ellipse cx="200" cy="305" rx="32" ry="20" fill="url(#bodyGrad)" />

    <!-- Head -->
    <circle cx="150" cy="145" r="82" fill="url(#bodyGrad)" />
    
    <!-- Eyes -->
    <ellipse cx="118" cy="138" rx="8" ry="11" fill="#4A2828" />
    <circle cx="115" cy="133" r="3.5" fill="#FFFFFF" />
    <ellipse cx="182" cy="138" rx="8" ry="11" fill="#4A2828" />
    <circle cx="179" cy="133" r="3.5" fill="#FFFFFF" />

    <!-- Cute Y Nose & Mouth -->
    <polygon points="150,154 144,148 156,148" fill="#E57399" />
    <path d="M150 154 v 7 m-6 -2 q 6 6 12 0" stroke="#4A2828" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Whiskers -->
    <line x1="85" y1="152" x2="65" y2="150" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round" />
    <line x1="85" y1="158" x2="68" y2="162" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round" />
    <line x1="215" y1="152" x2="235" y2="150" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round" />
    <line x1="215" y1="158" x2="232" y2="162" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round" />

    <!-- Rosy Cheek Blush -->
    <ellipse cx="102" cy="155" rx="14" ry="8" fill="#FF8DA1" opacity="0.65" filter="url(#softBlush)" />
    <ellipse cx="198" cy="155" rx="14" ry="8" fill="#FF8DA1" opacity="0.65" filter="url(#softBlush)" />

    <!-- Strawberry Pin on Ear -->
    <g transform="translate(185, 95)">
      <path d="M10 0 C18 0 20 12 10 22 C0 12 2 0 10 0 Z" fill="#E53935" />
      <path d="M7 -2 L10 2 L13 -2" stroke="#43A047" stroke-width="3" stroke-linecap="round" />
      <circle cx="8" cy="8" r="0.9" fill="#FFF" />
      <circle cx="12" cy="12" r="0.9" fill="#FFF" />
      <circle cx="9" cy="16" r="0.9" fill="#FFF" />
    </g>

  </g>

  <!-- Product Badge Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="36" rx="18" fill="#FFFDF7" stroke="#F4A6B7" stroke-width="2" />
    <circle cx="20" cy="18" r="6" fill="#E57399" />
    <text x="35" y="23" font-family="'Nunito', sans-serif" font-weight="800" font-size="12" fill="#3E2723" letter-spacing="0.5">NEW ARRIVAL</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(40, 500)">
    <rect width="520" height="65" rx="20" fill="#FFFFFF" opacity="0.95" stroke="#F8D7DA" stroke-width="1.5" />
    <text x="24" y="30" font-family="'Nunito', sans-serif" font-weight="900" font-size="18" fill="#3E2723">Fluffy Floppy Velvet Bunny</text>
    <text x="24" y="48" font-family="'Nunito', sans-serif" font-weight="600" font-size="12" fill="#9C7A82">Long Ear Pastel Rabbit with Strawberry</text>
    <!-- Stars -->
    <g transform="translate(420, 22)">
      <text font-family="'Segoe UI Emoji', sans-serif" font-size="14" fill="#FFB703">★★★★★</text>
    </g>
  </g>
</svg>
