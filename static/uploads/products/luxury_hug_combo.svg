<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FCE7EC" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F06292" />
      <stop offset="100%" stop-color="#E91E63" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#D87093" flood-opacity="0.18" />
    </filter>
    <filter id="softBlush" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background Canvas with soft borders -->
  <rect width="600" height="600" rx="36" fill="url(#cardBg)" />
  <rect x="12" y="12" width="576" height="576" rx="28" stroke="#F8D7DA" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Cute Ambient Background Hearts & Stars -->
  <g opacity="0.35">
    <path d="M80 90 Q80 80 90 80 A8 8 0 0 1 106 88 A8 8 0 0 1 122 80 Q132 80 132 90 Q132 110 106 130 Q80 110 80 90 Z" fill="#F4A6B7" />
    <path d="M490 140 Q490 132 498 132 A6 6 0 0 1 510 138 A6 6 0 0 1 522 132 Q530 132 530 140 Q530 156 510 172 Q490 156 490 140 Z" fill="#E57399" />
    <circle cx="510" cy="380" r="14" fill="#FCE4EC" />
    <circle cx="90" cy="460" r="20" fill="#FFF0F5" />
    <path d="M120 380 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#F4A6B7" opacity="0.6" />
    <path d="M470 460 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#E57399" opacity="0.6" />
  </g>

  <!-- Main Character Graphic -->
  <g transform="translate(150, 100)" filter="url(#dropShadow)">

    <ellipse cx="150" cy="320" rx="110" ry="20" fill="#3E2723" opacity="0.12" />
    <!-- Giant Teddy in Box Peeking Out -->
    <circle cx="100" cy="110" r="28" fill="#D4A373" />
    <circle cx="100" cy="110" r="16" fill="#FFF0F5" />
    <circle cx="200" cy="110" r="28" fill="#D4A373" />
    <circle cx="200" cy="110" r="16" fill="#FFF0F5" />
    <circle cx="150" cy="150" r="68" fill="#D4A373" />
    <ellipse cx="150" cy="168" rx="30" ry="22" fill="#FFFDF7" />
    <ellipse cx="150" cy="158" rx="10" ry="7" fill="#3E2723" />
    <circle cx="126" cy="142" r="7" fill="#3E2723" />
    <circle cx="124" cy="139" r="2.5" fill="#FFF" />
    <circle cx="174" cy="142" r="7" fill="#3E2723" />
    <circle cx="172" cy="139" r="2.5" fill="#FFF" />
    <!-- Cheeks -->
    <ellipse cx="114" cy="160" rx="10" ry="6" fill="#FF8DA1" opacity="0.6" filter="url(#softBlush)" />
    <ellipse cx="186" cy="160" rx="10" ry="6" fill="#FF8DA1" opacity="0.6" filter="url(#softBlush)" />

    <!-- Cute Hands Peeking over Box -->
    <ellipse cx="90" cy="205" rx="20" ry="16" fill="#D4A373" />
    <ellipse cx="210" cy="205" rx="20" ry="16" fill="#D4A373" />

    <!-- Luxury Gift Box Base -->
    <rect x="40" y="200" width="220" height="120" rx="18" fill="url(#bodyGrad)" stroke="#F4A6B7" stroke-width="3" />
    <!-- Vertical Satin Ribbon -->
    <rect x="135" y="200" width="30" height="120" fill="#E57399" />
    <line x1="150" y1="200" x2="150" y2="320" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8" />
    
    <!-- Big Satin Ribbon Bow -->
    <g transform="translate(150, 195)">
      <polygon points="0,0 -40,-25 -25,10" fill="#E57399" />
      <polygon points="0,0 40,-25 25,10" fill="#E57399" />
      <polygon points="0,0 -30,-40 0,-15" fill="#F48FB1" />
      <polygon points="0,0 30,-40 0,-15" fill="#F48FB1" />
      <circle cx="0" cy="0" r="14" fill="#C2185B" />
      <circle cx="-3" cy="-3" r="4" fill="#FFF" opacity="0.5" />
    </g>

    <!-- Hanging Tag -->
    <g transform="translate(195, 230) rotate(15)">
      <polygon points="0,0 35,0 45,15 35,30 0,30" fill="#FFFDF7" stroke="#E57399" stroke-width="1.5" />
      <circle cx="8" cy="15" r="3" fill="#E57399" />
      <text x="14" y="20" font-family="'Nunito', sans-serif" font-weight="800" font-size="10" fill="#D81B60">FOR YOU</text>
    </g>

  </g>

  <!-- Product Badge Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="36" rx="18" fill="#FFFDF7" stroke="#F4A6B7" stroke-width="2" />
    <circle cx="20" cy="18" r="6" fill="#E57399" />
    <text x="35" y="23" font-family="'Nunito', sans-serif" font-weight="800" font-size="12" fill="#3E2723" letter-spacing="0.5">GIFT BOX</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(40, 500)">
    <rect width="520" height="65" rx="20" fill="#FFFFFF" opacity="0.95" stroke="#F8D7DA" stroke-width="1.5" />
    <text x="24" y="30" font-family="'Nunito', sans-serif" font-weight="900" font-size="18" fill="#3E2723">Grand Romantic Hug Combo</text>
    <text x="24" y="48" font-family="'Nunito', sans-serif" font-weight="600" font-size="12" fill="#9C7A82">Giant Bear + Fairy Lights + Gift Ribbon</text>
    <!-- Stars -->
    <g transform="translate(420, 22)">
      <text font-family="'Segoe UI Emoji', sans-serif" font-size="14" fill="#FFB703">★★★★★</text>
    </g>
  </g>
</svg>
