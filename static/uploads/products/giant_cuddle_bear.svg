<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FCE7EC" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8" />
      <stop offset="100%" stop-color="#A1887F" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#D87093" flood-opacity="0.18" />
    </filter>
    <filter id="softBlush" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background Canvas with soft borders -->
  <rect width="600" height="600" rx="36" fill="url(#cardBg)" />
  <rect x="12" y="12" width="576" height="576" rx="28" stroke="#F8D7DA" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Cute Ambient Background Hearts & Stars -->
  <g opacity="0.35">
    <path d="M80 90 Q80 80 90 80 A8 8 0 0 1 106 88 A8 8 0 0 1 122 80 Q132 80 132 90 Q132 110 106 130 Q80 110 80 90 Z" fill="#F4A6B7" />
    <path d="M490 140 Q490 132 498 132 A6 6 0 0 1 510 138 A6 6 0 0 1 522 132 Q530 132 530 140 Q530 156 510 172 Q490 156 490 140 Z" fill="#E57399" />
    <circle cx="510" cy="380" r="14" fill="#FCE4EC" />
    <circle cx="90" cy="460" r="20" fill="#FFF0F5" />
    <path d="M120 380 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#F4A6B7" opacity="0.6" />
    <path d="M470 460 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#E57399" opacity="0.6" />
  </g>

  <!-- Main Character Graphic -->
  <g transform="translate(150, 100)" filter="url(#dropShadow)">

    <!-- Shadow beneath character -->
    <ellipse cx="150" cy="320" rx="90" ry="18" fill="#3E2723" opacity="0.1" />
    
    <!-- Back Ears -->
    <circle cx="75" cy="85" r="38" fill="url(#bodyGrad)" />
    <circle cx="75" cy="85" r="22" fill="#FDF2F4" />
    <circle cx="225" cy="85" r="38" fill="url(#bodyGrad)" />
    <circle cx="225" cy="85" r="22" fill="#FDF2F4" />

    <!-- Chubby Body -->
    <ellipse cx="150" cy="235" rx="100" ry="90" fill="url(#bodyGrad)" />
    <!-- Tummy Patch -->
    <ellipse cx="150" cy="245" rx="65" ry="60" fill="#FFFDF7" opacity="0.9" />

    <!-- Cute Arms -->
    <ellipse cx="55" cy="220" rx="28" ry="50" transform="rotate(22 55 220)" fill="url(#bodyGrad)" />
    <ellipse cx="245" cy="220" rx="28" ry="50" transform="rotate(-22 245 220)" fill="url(#bodyGrad)" />

    <!-- Cute Feet / Paws with paw prints -->
    <ellipse cx="90" cy="300" rx="38" ry="26" fill="url(#bodyGrad)" />
    <ellipse cx="90" cy="300" rx="26" ry="18" fill="#FFF0F5" />
    <circle cx="80" cy="290" r="5" fill="#E57399" opacity="0.6" />
    <circle cx="90" cy="286" r="5" fill="#E57399" opacity="0.6" />
    <circle cx="100" cy="290" r="5" fill="#E57399" opacity="0.6" />

    <ellipse cx="210" cy="300" rx="38" ry="26" fill="url(#bodyGrad)" />
    <ellipse cx="210" cy="300" rx="26" ry="18" fill="#FFF0F5" />
    <circle cx="200" cy="290" r="5" fill="#E57399" opacity="0.6" />
    <circle cx="210" cy="286" r="5" fill="#E57399" opacity="0.6" />
    <circle cx="220" cy="290" r="5" fill="#E57399" opacity="0.6" />

    <!-- Big Soft Head -->
    <circle cx="150" cy="140" r="88" fill="url(#bodyGrad)" />
    
    <!-- White Muzzle -->
    <ellipse cx="150" cy="165" rx="42" ry="32" fill="#FFFDF7" />
    <!-- Cute Dark Velvet Nose -->
    <ellipse cx="150" cy="150" rx="16" ry="11" fill="#3E2723" />
    <ellipse cx="146" cy="147" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.7" />
    <path d="M150 161 v 14 m-12 -4 q 12 10 24 0" stroke="#3E2723" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Big Innocent Eyes -->
    <circle cx="115" cy="125" r="11" fill="#2E1C14" />
    <circle cx="112" cy="121" r="4.5" fill="#FFFFFF" />
    <circle cx="118" cy="128" r="2" fill="#FFFFFF" />

    <circle cx="185" cy="125" r="11" fill="#2E1C14" />
    <circle cx="182" cy="121" r="4.5" fill="#FFFFFF" />
    <circle cx="188" cy="128" r="2" fill="#FFFFFF" />

    <!-- Rosy Cheek Blush -->
    <ellipse cx="100" cy="152" rx="14" ry="9" fill="#FF8DA1" opacity="0.6" filter="url(#softBlush)" />
    <ellipse cx="200" cy="152" rx="14" ry="9" fill="#FF8DA1" opacity="0.6" filter="url(#softBlush)" />

    <!-- Satin Neck Bow -->
    <polygon points="150,200 120,185 120,215" fill="#E57399" />
    <polygon points="150,200 180,185 180,215" fill="#E57399" />
    <circle cx="150" cy="200" r="8" fill="#D81B60" />
    <path d="M148 206 Q142 225 135 235" stroke="#D81B60" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M152 206 Q158 225 165 235" stroke="#D81B60" stroke-width="4" stroke-linecap="round" fill="none" />

  </g>

  <!-- Product Badge Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="36" rx="18" fill="#FFFDF7" stroke="#F4A6B7" stroke-width="2" />
    <circle cx="20" cy="18" r="6" fill="#E57399" />
    <text x="35" y="23" font-family="'Nunito', sans-serif" font-weight="800" font-size="12" fill="#3E2723" letter-spacing="0.5">GIANT PLUSH</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(40, 500)">
    <rect width="520" height="65" rx="20" fill="#FFFFFF" opacity="0.95" stroke="#F8D7DA" stroke-width="1.5" />
    <text x="24" y="30" font-family="'Nunito', sans-serif" font-weight="900" font-size="18" fill="#3E2723">Giant 100cm Fluffy Papa Bear</text>
    <text x="24" y="48" font-family="'Nunito', sans-serif" font-weight="600" font-size="12" fill="#9C7A82">Full Body Huggable Life-Size Bear</text>
    <!-- Stars -->
    <g transform="translate(420, 22)">
      <text font-family="'Segoe UI Emoji', sans-serif" font-size="14" fill="#FFB703">★★★★★</text>
    </g>
  </g>
</svg>
