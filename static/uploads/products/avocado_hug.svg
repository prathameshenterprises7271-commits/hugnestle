<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FCE7EC" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CB342" />
      <stop offset="100%" stop-color="#558B2F" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#D87093" flood-opacity="0.18" />
    </filter>
    <filter id="softBlush" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background Canvas with soft borders -->
  <rect width="600" height="600" rx="36" fill="url(#cardBg)" />
  <rect x="12" y="12" width="576" height="576" rx="28" stroke="#F8D7DA" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Cute Ambient Background Hearts & Stars -->
  <g opacity="0.35">
    <path d="M80 90 Q80 80 90 80 A8 8 0 0 1 106 88 A8 8 0 0 1 122 80 Q132 80 132 90 Q132 110 106 130 Q80 110 80 90 Z" fill="#F4A6B7" />
    <path d="M490 140 Q490 132 498 132 A6 6 0 0 1 510 138 A6 6 0 0 1 522 132 Q530 132 530 140 Q530 156 510 172 Q490 156 490 140 Z" fill="#E57399" />
    <circle cx="510" cy="380" r="14" fill="#FCE4EC" />
    <circle cx="90" cy="460" r="20" fill="#FFF0F5" />
    <path d="M120 380 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#F4A6B7" opacity="0.6" />
    <path d="M470 460 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#E57399" opacity="0.6" />
  </g>

  <!-- Main Character Graphic -->
  <g transform="translate(150, 100)" filter="url(#dropShadow)">

    <ellipse cx="150" cy="320" rx="90" ry="18" fill="#3E2723" opacity="0.1" />
    <!-- Avocado Outer Peel -->
    <path d="M150 60 C80 60 50 160 50 220 C50 280 90 320 150 320 C210 320 250 280 250 220 C250 160 220 60 150 60 Z" fill="#558B2F" />
    <!-- Light Green Flesh -->
    <path d="M150 78 C90 78 68 165 68 220 C68 270 102 305 150 305 C198 305 232 270 232 220 C232 165 210 78 150 78 Z" fill="#DCEDC8" />

    <!-- Cute Brown Seed with Face -->
    <circle cx="150" cy="225" r="52" fill="#795548" />
    <circle cx="140" cy="212" r="7" fill="#3E2723" />
    <circle cx="138" cy="209" r="2.8" fill="#FFFFFF" />
    <circle cx="160" cy="212" r="7" fill="#3E2723" />
    <circle cx="158" cy="209" r="2.8" fill="#FFFFFF" />
    
    <!-- Smile -->
    <path d="M142 225 Q150 235 158 225" stroke="#3E2723" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Rosy Cheeks -->
    <ellipse cx="130" cy="225" rx="8" ry="5" fill="#FF8DA1" opacity="0.75" />
    <ellipse cx="170" cy="225" rx="8" ry="5" fill="#FF8DA1" opacity="0.75" />

    <!-- Little Arms & Feet -->
    <ellipse cx="56" cy="200" rx="12" ry="24" transform="rotate(30 56 200)" fill="#558B2F" />
    <ellipse cx="244" cy="200" rx="12" ry="24" transform="rotate(-30 244 200)" fill="#558B2F" />
    <ellipse cx="120" cy="320" rx="16" ry="12" fill="#795548" />
    <ellipse cx="180" cy="320" rx="16" ry="12" fill="#795548" />

  </g>

  <!-- Product Badge Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="36" rx="18" fill="#FFFDF7" stroke="#F4A6B7" stroke-width="2" />
    <circle cx="20" cy="18" r="6" fill="#E57399" />
    <text x="35" y="23" font-family="'Nunito', sans-serif" font-weight="800" font-size="12" fill="#3E2723" letter-spacing="0.5">COZY HUG</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(40, 500)">
    <rect width="520" height="65" rx="20" fill="#FFFFFF" opacity="0.95" stroke="#F8D7DA" stroke-width="1.5" />
    <text x="24" y="30" font-family="'Nunito', sans-serif" font-weight="900" font-size="18" fill="#3E2723">Smiling Avocado Hug Cushion</text>
    <text x="24" y="48" font-family="'Nunito', sans-serif" font-weight="600" font-size="12" fill="#9C7A82">Warm Ergonomic Bed & Couch Hugger</text>
    <!-- Stars -->
    <g transform="translate(420, 22)">
      <text font-family="'Segoe UI Emoji', sans-serif" font-size="14" fill="#FFB703">★★★★★</text>
    </g>
  </g>
</svg>
