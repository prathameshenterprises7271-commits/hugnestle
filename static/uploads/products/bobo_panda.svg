<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FCE7EC" />
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#424242" />
      <stop offset="100%" stop-color="#212121" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#D87093" flood-opacity="0.18" />
    </filter>
    <filter id="softBlush" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background Canvas with soft borders -->
  <rect width="600" height="600" rx="36" fill="url(#cardBg)" />
  <rect x="12" y="12" width="576" height="576" rx="28" stroke="#F8D7DA" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Cute Ambient Background Hearts & Stars -->
  <g opacity="0.35">
    <path d="M80 90 Q80 80 90 80 A8 8 0 0 1 106 88 A8 8 0 0 1 122 80 Q132 80 132 90 Q132 110 106 130 Q80 110 80 90 Z" fill="#F4A6B7" />
    <path d="M490 140 Q490 132 498 132 A6 6 0 0 1 510 138 A6 6 0 0 1 522 132 Q530 132 530 140 Q530 156 510 172 Q490 156 490 140 Z" fill="#E57399" />
    <circle cx="510" cy="380" r="14" fill="#FCE4EC" />
    <circle cx="90" cy="460" r="20" fill="#FFF0F5" />
    <path d="M120 380 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#F4A6B7" opacity="0.6" />
    <path d="M470 460 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z" fill="#E57399" opacity="0.6" />
  </g>

  <!-- Main Character Graphic -->
  <g transform="translate(150, 100)" filter="url(#dropShadow)">

    <ellipse cx="150" cy="320" rx="90" ry="18" fill="#3E2723" opacity="0.1" />
    <!-- Black Ears -->
    <circle cx="75" cy="85" r="34" fill="#2E2B2A" />
    <circle cx="225" cy="85" r="34" fill="#2E2B2A" />

    <!-- Chubby White Body -->
    <ellipse cx="150" cy="235" rx="98" ry="88" fill="#FFFFFF" stroke="#E2DCD5" stroke-width="2" />
    <!-- Black Arms holding Boba -->
    <ellipse cx="60" cy="225" rx="26" ry="45" transform="rotate(28 60 225)" fill="#2E2B2A" />
    <ellipse cx="240" cy="225" rx="26" ry="45" transform="rotate(-28 240 225)" fill="#2E2B2A" />
    <ellipse cx="90" cy="300" rx="36" ry="24" fill="#2E2B2A" />
    <ellipse cx="210" cy="300" rx="36" ry="24" fill="#2E2B2A" />

    <!-- White Head -->
    <circle cx="150" cy="140" r="86" fill="#FFFFFF" stroke="#E2DCD5" stroke-width="2" />

    <!-- Iconic Panda Eye Patches -->
    <ellipse cx="110" cy="130" rx="20" ry="25" transform="rotate(-15 110 130)" fill="#2E2B2A" />
    <circle cx="112" cy="128" r="7" fill="#FFFFFF" />
    <circle cx="114" cy="129" r="3.5" fill="#2E2B2A" />
    <circle cx="110" cy="126" r="2" fill="#FFFFFF" />

    <ellipse cx="190" cy="130" rx="20" ry="25" transform="rotate(15 190 130)" fill="#2E2B2A" />
    <circle cx="188" cy="128" r="7" fill="#FFFFFF" />
    <circle cx="186" cy="129" r="3.5" fill="#2E2B2A" />
    <circle cx="189" cy="126" r="2" fill="#FFFFFF" />

    <!-- Nose & Mouth -->
    <ellipse cx="150" cy="155" rx="14" ry="9" fill="#2E2B2A" />
    <path d="M150 164 v 10 m-8 -3 q 8 8 16 0" stroke="#2E2B2A" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Blush -->
    <ellipse cx="90" cy="160" rx="14" ry="8" fill="#FF8DA1" opacity="0.6" filter="url(#softBlush)" />
    <ellipse cx="210" cy="160" rx="14" ry="8" fill="#FF8DA1" opacity="0.6" filter="url(#softBlush)" />

    <!-- Cute Boba Cup Held in Front -->
    <g transform="translate(125, 205)">
      <rect x="10" y="10" width="30" height="42" rx="6" fill="#FFF0DB" stroke="#D4A373" stroke-width="2" />
      <rect x="6" y="6" width="38" height="7" rx="3" fill="#D4A373" />
      <rect x="23" y="-8" width="5" height="16" rx="2" fill="#E57399" />
      <circle cx="18" cy="42" r="3.5" fill="#583101" />
      <circle cx="26" cy="44" r="3" fill="#583101" />
      <circle cx="32" cy="40" r="3.2" fill="#583101" />
      <circle cx="22" cy="34" r="2.8" fill="#583101" />
    </g>

  </g>

  <!-- Product Badge Pill -->
  <g transform="translate(40, 40)">
    <rect width="130" height="36" rx="18" fill="#FFFDF7" stroke="#F4A6B7" stroke-width="2" />
    <circle cx="20" cy="18" r="6" fill="#E57399" />
    <text x="35" y="23" font-family="'Nunito', sans-serif" font-weight="800" font-size="12" fill="#3E2723" letter-spacing="0.5">TRENDING</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(40, 500)">
    <rect width="520" height="65" rx="20" fill="#FFFFFF" opacity="0.95" stroke="#F8D7DA" stroke-width="1.5" />
    <text x="24" y="30" font-family="'Nunito', sans-serif" font-weight="900" font-size="18" fill="#3E2723">Boba Bobo Panda Plush</text>
    <text x="24" y="48" font-family="'Nunito', sans-serif" font-weight="600" font-size="12" fill="#9C7A82">Chubby 38cm Plushie with Boba Cup</text>
    <!-- Stars -->
    <g transform="translate(420, 22)">
      <text font-family="'Segoe UI Emoji', sans-serif" font-size="14" fill="#FFB703">★★★★★</text>
    </g>
  </g>
</svg>
